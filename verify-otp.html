<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP - LeezWorld</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link rel="stylesheet" href="main.css"/>
  <style>
    .otp-container {
      max-width: 450px;
      margin: 80px auto;
      padding: 40px 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    .otp-icon {
      font-size: 60px;
      color: #ff6600;
      margin-bottom: 20px;
    }

    .otp-container h1 {
      font-size: 1.8rem;
      color: #222;
      margin-bottom: 10px;
    }

    .otp-container p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .otp-container .email-display {
      color: #ff6600;
      font-weight: 600;
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .otp-inputs input {
      width: 50px;
      height: 55px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .otp-inputs input:focus {
      border-color: #ff6600;
    }

    .verify-btn {
      width: 100%;
      padding: 15px;
      background: #ff6600;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .verify-btn:hover {
      background: #e55c00;
    }

    .verify-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .resend-link {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
    }

    .resend-link a {
      color: #ff6600;
      text-decoration: none;
      font-weight: 600;
    }

    .resend-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #ff6600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">LeezWorld<span>.</span></a>
      <div class="header-actions">
        <a href="sign-up.html"><i class="fa-regular fa-user"></i><span>Account</span></a>
        <a href="wishlist.html"><i class="fa-regular fa-heart"></i><span>Wishlist</span></a>
        <a href="cart.html" class="cart-link">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count" id="cartCount">0</span>
          <span>Cart</span>
        </a>
      </div>
    </div>
  </header>

  <!-- OTP Verification -->
  <div class="otp-container">
    <div class="otp-icon">
      <i class="fa-solid fa-envelope-circle-check"></i>
    </div>
    
    <h1>Verify Your Email</h1>
    <p>We've sent a 6-digit code to<br><span class="email-display" id="userEmail">your email</span></p>
    
    <p class="error-message" id="errorMsg">Invalid OTP. Please try again.</p>
    
    <div class="otp-inputs">
      <input type="text" maxlength="1" class="otp-input" autofocus>
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
    </div>
    
    <button class="verify-btn" id="verifyBtn">Verify & Place Order</button>
    
    <p class="resend-link">
      Didn't receive the code? <a href="#" id="resendLink">Resend OTP</a>
    </p>
    
    <a href="checkout.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Checkout
    </a>
  </div>

<script>
  // ==========================================
  // EMAILJS CONFIGURATION
  // ==========================================
  const EMAILJS_CONFIG = {
    publicKey: '7ivOx68DOXXa8lvMH',
    serviceId: 'service_7179pcq',
    templateId: 'template_y3tusek'
  };

  // Initialize EmailJS
  emailjs.init(EMAILJS_CONFIG.publicKey);

  // ==========================================
  // GET STORED DATA (from checkout page)
  // DO NOT generate new OTP here!
  // ==========================================
  const userEmail = sessionStorage.getItem('leezworld_email');
  const storedOTP = sessionStorage.getItem('leezworld_otp');
  const userName = sessionStorage.getItem('leezworld_name') || 'Customer';
  
  // Track if email was already sent
  let emailSent = sessionStorage.getItem('leezworld_otp_sent') === 'true';

  console.log('📧 Email:', userEmail);
  console.log('🔐 OTP:', storedOTP);
  console.log('📨 Email already sent:', emailSent);

  // ==========================================
  // CHECK IF DATA EXISTS
  // ==========================================
  if (!userEmail || !storedOTP) {
    alert('⚠️ Session expired.\n\nPlease go back to checkout.');
    window.location.href = 'checkout.html';
  }

  // Display email on page
  document.getElementById('userEmail').textContent = userEmail || 'your email';

  // ==========================================
  // SEND OTP EMAIL FUNCTION
  // ==========================================
  function sendOTPEmail(email, otpCode) {
    if (!email || email === 'your email') {
      alert('⚠️ Email address is missing.');
      return;
    }

    console.log('📤 Sending OTP:', otpCode, 'to:', email);

    const templateParams = {
      to_email: email,
      to_name: userName.split(' ')[0],
      otp_code: otpCode
    };

    const verifyBtn = document.getElementById('verifyBtn');
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Sending OTP...';

    emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, templateParams)
      .then(function(response) {
        console.log('✅ Email sent!', response.status);
        alert('✅ OTP sent to ' + email + '\n\nCheck your inbox.');
        
        // Mark email as sent
        sessionStorage.setItem('leezworld_otp_sent', 'true');
        emailSent = true;
        
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Place Order';
      })
      .catch(function(error) {
        console.error('❌ Failed:', error);
        alert('❌ Failed to send OTP.\n\nPlease click "Resend OTP".');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Place Order';
      });
  }

  // ==========================================
  // SEND OTP ON PAGE LOAD (ONLY ONCE!)
  // ==========================================
  window.addEventListener('load', function() {
    // Only send if not already sent
    if (!emailSent && userEmail && storedOTP) {
      console.log('📨 First visit - sending OTP...');
      sendOTPEmail(userEmail, storedOTP);
    } else if (emailSent) {
      console.log('📨 Email already sent - not sending again');
    }
  });

  // ==========================================
  // OTP INPUT HANDLING
  // ==========================================
  const otpInputs = document.querySelectorAll('.otp-input');
  
  otpInputs.forEach(function(input, index) {
    input.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value && index < otpInputs.length - 1) {
        otpInputs[index + 1].focus();
      }
    });
    
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !this.value && index > 0) {
        otpInputs[index - 1].focus();
      }
    });
    
    input.addEventListener('paste', function(e) {
      e.preventDefault();
      const pasteData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
      for (let i = 0; i < pasteData.length && i < otpInputs.length; i++) {
        otpInputs[i].value = pasteData[i];
      }
    });
  });

  // ==========================================
  // VERIFY BUTTON
  // ==========================================
  document.getElementById('verifyBtn').addEventListener('click', function() {
    let enteredOTP = '';
    otpInputs.forEach(function(input) {
      enteredOTP += input.value;
    });
    
    if (enteredOTP.length !== 6) {
      document.getElementById('errorMsg').textContent = 'Please enter all 6 digits';
      document.getElementById('errorMsg').style.display = 'block';
      return;
    }
    
    // Get the current OTP from sessionStorage (in case it was resent)
    const currentOTP = sessionStorage.getItem('leezworld_otp');
    
    if (enteredOTP === currentOTP) {
      console.log('✅ OTP verified!');
      
      const trackingId = 'LW' + Date.now().toString().slice(-8);
      sessionStorage.setItem('leezworld_tracking', trackingId);
      
      // DON'T clear cart here - order-success.html needs it for receipt!
      // localStorage.setItem('leezworld_cart', JSON.stringify([]));  // ← REMOVE OR COMMENT THIS
      
      sessionStorage.removeItem('leezworld_otp');
      sessionStorage.removeItem('leezworld_otp_sent');
      
      window.location.href = 'order-success.html';
    }else {
      document.getElementById('errorMsg').textContent = 'Invalid OTP. Please try again.';
      document.getElementById('errorMsg').style.display = 'block';
      otpInputs.forEach(function(input) { input.value = ''; });
      otpInputs[0].focus();
    }
  });

  // ==========================================
  // RESEND OTP (Only place where new OTP is generated!)
  // ==========================================
  document.getElementById('resendLink').addEventListener('click', function(e) {
    e.preventDefault();
    
    // Generate NEW OTP only when resending
    const newOTP = Math.floor(100000 + Math.random() * 900000).toString();
    sessionStorage.setItem('leezworld_otp', newOTP);
    sessionStorage.setItem('leezworld_otp_sent', 'false');
    
    console.log('🆕 New OTP generated:', newOTP);
    
    sendOTPEmail(userEmail, newOTP);
    
    otpInputs.forEach(function(input) { input.value = ''; });
    otpInputs[0].focus();
    document.getElementById('errorMsg').style.display = 'none';
  });
</script>

</body>
</html>
