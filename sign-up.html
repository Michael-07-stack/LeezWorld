<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Nexlify | Quality Household Furniture</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="sign.css"/>  
</head>
<body>

  <div class="signup-container">
    <div class="signup-header">
      <h1>Create Your Account</h1>
      <p>Join Nexlify and enjoy exclusive deals on premium furniture</p>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>
    </form>

    <div class="social-login">
      <p>Or sign up with</p>
      <button class="social-btn google-btn"><i class="fab fa-google"></i> Continue with Google</button>
      <button class="social-btn facebook-btn"><i class="fab fa-facebook-f"></i> Continue with Facebook</button>
    </div>

    <div class="terms">
      By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>

    <div class="login-link">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

</body>
</html>
